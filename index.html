<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wanlai English Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: professional and calm, warm for families — a school English hub.
   IDEA: a school notice board: live "Wanlai right now" panel, clean map, tidy notices; highlighter-yellow on key words.
   PICTURE: flat neighbourhood map of the school in the hero.
   COLOUR and TYPE: deep blue + navy, sunny yellow accent, black ink on white; DM Serif Display + DM Sans.
   LAYOUT: white sticky header (logo, tabs, language), hero text left + map right, live band, cards, navy school band. */
:root{color-scheme:light;
--ink:#141414;--soft:#4b4f57;--faint:#868b94;--blue:#1f4e9c;--blueD:#163a77;--navy:#13294b;--yellow:#f6b900;--yellowS:#fff3c4;--sky:#eaf1fb;
--line:#e4e7ec;--lineS:#f3f5f8;
--sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.07);--shH:0 2px 4px rgba(16,24,40,.06),0 14px 32px rgba(16,24,40,.12);
--serif:"Times New Roman",Times,"Noto Serif TC","PMingLiU",serif;--sans:"Century Gothic",CenturyGothic,AppleGothic,Questrial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
body{overflow-anchor:none;margin:0;background:#fff;color:var(--ink);font:16.5px/1.65 var(--sans);overflow-x:clip}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:0;line-height:1.12;text-wrap:balance;margin:0 0 .45em;color:var(--ink)}
h1{font-size:clamp(38px,5vw,58px)}h1 em{font-style:italic;color:var(--blue)}h2{font-size:clamp(28px,3.2vw,38px)}h3{font-size:23px}
.hl{color:var(--blue);background:linear-gradient(transparent 62%,var(--yellowS) 62%)}
a{color:var(--blue)}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(4vw,18px)}
.band{padding:clamp(36px,5vw,72px) 0}
.eyebrow{font:700 13px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:3px;background:var(--yellow);border-radius:2px;flex:none}
/* translation (shown under the English when Chinese is on) */
.tr{display:none}
html.zh .tr{display:block;font-family:"Noto Sans TC",var(--sans);font-size:.82em;font-weight:500;color:var(--soft);line-height:1.5;margin-top:.15em;text-transform:none;letter-spacing:0;font-style:normal}
html.zh h1 .tr,html.zh h2 .tr{font-size:.5em;font-weight:500}
html.zh .btn .tr{color:inherit;opacity:.85;font-size:.8em}
html.zh .on-dark .tr,html.zh .live .tr,html.zh .navy .tr,html.zh footer .tr{color:#c9d3e4}
/* header */
.top{background:rgba(255,255,255,.95);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);box-shadow:inset 0 -3px 0 var(--yellow)}
.top .wrap{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-right:auto}
.logo{width:46px;height:46px;flex:none;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:#fff;border:2px dashed #c8d0dc}.logo.has{border:0;border-radius:50%;background:transparent}
.logo img{width:100%;height:100%;object-fit:contain;background:transparent}
.brand b{display:block;font:700 19px/1.2 var(--serif);max-width:24ch}
.brand small{display:block;font:500 13px var(--sans);color:var(--soft)}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs a{color:var(--ink);text-decoration:none;font-family:var(--serif);font-size:17.5px;font-weight:700;padding:8px 14px;border-radius:8px;min-height:44px;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.tabs a:hover{background:var(--lineS)}.tabs a.on{background:var(--blue);color:#fff}
html.zh .tabs a.on .tr{color:#dfe8f8}
.lang{position:relative}
.langbtn{font:600 15px var(--sans);color:var(--ink);border:1px solid #cfd5de;border-radius:8px;padding:0 14px;min-height:44px;background:#fff;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.langbtn:hover{border-color:var(--blue)}
.langbtn.icon{width:44px;padding:0;justify-content:center;border-color:transparent}.langbtn.icon:hover{background:var(--lineS);border-color:transparent}.langbtn.icon svg{width:22px;height:22px}
.navr{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.langbtn svg{width:18px;height:18px}
.langmenu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shH);padding:6px;min-width:220px;z-index:30;text-align:left}
.langmenu[hidden]{display:none}
.langmenu button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;font:600 15px var(--sans);color:var(--ink);background:none;border:0;border-radius:7px;padding:10px 12px;min-height:44px;cursor:pointer;text-align:left}
.langmenu button:hover{background:var(--lineS)}
.langmenu button[aria-checked=true]{color:var(--blue)}.langmenu button[aria-checked=true]::after{content:"✓";color:var(--blue)}
.gate .lang{display:flex;justify-content:center;margin-top:20px}.gate .langmenu{left:50%;right:auto;transform:translateX(-50%)}
.sub{background:var(--lineS);border-bottom:1px solid var(--line)}
.sub .wrap{display:flex;gap:6px;flex-wrap:wrap;padding-block:10px}
.sub a{color:var(--soft);text-decoration:none;font-weight:600;font-size:15px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;min-height:40px;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.sub a:hover{border-color:var(--blue);color:var(--blue)}.sub a.on{background:var(--navy);border-color:var(--navy);color:#fff}
html.zh .sub a.on .tr{color:#dfe8f8}
.sub:empty{display:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
/* hero */
.hero{background:linear-gradient(90deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.82) 36%,rgba(255,255,255,.2) 54%,rgba(255,255,255,.05) 100%),var(--herobg) 0% 40%/132% auto no-repeat,#fff}
@media(max-width:860px){.hero{background:linear-gradient(rgba(255,255,255,.84),rgba(255,255,255,.78)),var(--herobg) 70% 30%/cover no-repeat,#fff}}
.hero .wrap{display:grid;grid-template-columns:minmax(0,560px) 1fr;gap:clamp(24px,4vw,60px);align-items:center;padding-block:clamp(56px,9vw,130px) clamp(40px,5vw,72px)}
.hero h1{font-size:clamp(34px,4vw,50px);line-height:1.08}
.hero .lead{font-size:18px;color:#2f343c;max-width:46ch;margin:0 0 18px}
.nowcard{justify-self:end;align-self:end;width:230px;margin-bottom:-28px;padding:12px 16px !important;background:linear-gradient(135deg,rgba(19,41,75,.86),rgba(31,78,156,.82));backdrop-filter:blur(6px);color:#fff;border-radius:16px;padding:20px 22px;box-shadow:var(--shH);border-bottom:5px solid var(--yellow)}
.nowcard .tagl{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:8px}
.nowrow+.nowrow{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22)}
.nowcard .dot{padding:0;width:10px;height:10px;background:none}.nowcard .dot::before{width:10px;height:10px}
.nowcard .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#c4d3ee;font-weight:700;margin-bottom:4px}
.nowcard .time{font:700 24px/1.1 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.nowcard .sm{font-size:12.5px;color:#dbe5f5;line-height:1.45;margin-top:4px}
.nowcard a{color:var(--yellow)}
html.zh .nowcard .tr{color:#c9d3e4}
@media(max-width:860px){.nowcard{justify-self:stretch;width:100%;margin-bottom:0}}
.postcard{margin:0;background:#fbf8f1;border:1px solid #e9e2d3;border-radius:16px;overflow:hidden;box-shadow:var(--shH);border-bottom:6px solid #d9a21b}
.postcard svg,.postcard img{display:block;width:100%;height:auto}
.postcard figcaption{padding:12px 16px;font-size:13.5px;color:var(--faint);background:#fff}
html:not(.zh) .z{display:none}
.tagline{font:italic 600 18px/1.4 var(--sans);color:var(--blueD);margin:0 0 16px;display:flex;align-items:center;gap:10px}.tagline:not(.nolead)::before{content:"";width:22px;height:3px;background:var(--yellow);border-radius:2px;flex:none}.tagline b{color:var(--ink);font-weight:600}
.hero p{font-size:18px;color:var(--soft);max-width:52ch;margin:0 0 12px}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.hero .btns .btn{white-space:nowrap}
.btn{font:600 16px var(--sans);text-decoration:none;border-radius:10px;padding:12px 20px;min-height:48px;display:inline-flex;flex-direction:column;justify-content:center;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;line-height:1.3}
.btn:hover{background:var(--blueD)}
.btn.alt{background:#fff;color:var(--ink);border-color:#cfd5de}.btn.alt:hover{border-color:var(--blue);color:var(--blue)}
.btn.y{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}.btn.y:hover{background:#ffc928}
/* live panel */
.live{background:linear-gradient(110deg,var(--navy),var(--blue));color:#fff;border-radius:16px;padding:22px 28px;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:10px 32px;align-items:start;box-shadow:var(--sh)}
.live .tagl{display:flex;align-items:center;gap:10px;grid-column:1/-1;font-weight:600}
.dot{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.08em}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.live .lab{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:#c4d3ee;font-weight:600;margin-bottom:4px}
.time{font:700 clamp(34px,4.4vw,46px)/1.05 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.live .sm{font-size:14.5px;color:#dbe5f5}
.live .col{padding-left:26px;border-left:1px solid rgba(255,255,255,.2)}
.live .col:first-of-type{padding-left:0;border:0}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--sh);border-top:4px solid var(--blue)}
.card.y{border-top-color:var(--yellow)}.card.n{border-top-color:var(--navy)}
.card .lab{font:700 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.big{font:700 clamp(34px,4vw,44px)/1.1 var(--serif);color:var(--blue)}
.more{font:700 14px var(--sans);color:var(--blue);text-decoration:none;display:inline-flex;align-items:center;gap:6px;border-bottom:2px solid var(--yellow);padding-bottom:1px}
.more:hover{color:var(--blueD)}
.tiles a{text-decoration:none;color:inherit;display:block;height:100%}
.tiles .card{height:100%;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}.tiles a:hover .card{box-shadow:var(--shH);transform:translateY(-2px)}
.tiles .card .more{margin-top:auto;width:max-content}
.subs{font-size:14px;color:var(--soft);margin:0 0 16px}
/* navy school band */
.navy{background:var(--navy);color:#fff}
.navy h2{color:#fff}.navy p{color:#d3dcec}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.facts div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:18px;border-top:3px solid var(--yellow)}
.facts b{display:block;font:700 36px/1 var(--serif);color:#fff}
.facts span{font-size:14px;color:#c4d3ee;font-weight:500}
.note{font-size:13.5px;color:var(--faint)}.navy .note{color:#9fb0cc}
.list{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.list li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--sh);border-left:4px solid var(--blue)}
.list li.now{border-left-color:var(--yellow)}
.list .meta{font-size:14px;color:var(--faint)}
.empty{border:1px dashed #cfd5de;border-radius:12px;padding:22px;color:var(--soft);background:#fafbfc}
.pagehead{background:radial-gradient(60% 100% at 0% 0%,var(--sky),transparent 70%);border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;font:600 15px var(--sans);color:var(--blue);background:#fff;border:1px solid #cfd5de;border-radius:999px;padding:6px 16px 6px 10px;min-height:40px;cursor:pointer;margin-bottom:18px;box-shadow:var(--sh)}
.back:hover{border-color:var(--blue);background:var(--sky)}
.back svg{width:18px;height:18px}
html.zh .back .tr{display:inline;margin:0 0 0 4px;font-size:.85em}
.pagehead p{max-width:68ch;font-size:18px;margin:0;color:var(--soft)}
.prose{max-width:70ch}.prose p{margin:0 0 1.1em}
.tag{display:inline-block;font:700 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;background:var(--blue);color:#fff;border-radius:6px;padding:4px 9px}
.tag.y{background:var(--yellow);color:var(--ink)}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:18px;margin-bottom:32px}
.media .vid{grid-column:1/-1}
.frame{margin:0}.frame .box{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#f7f9fc;border:1px dashed #c8d0dc;display:grid;place-items:center;color:var(--faint);text-align:center;font-weight:600}
.vid .box{aspect-ratio:16/9;max-width:880px}.frame.full .box{border:0;background:#000;box-shadow:var(--sh)}
.frame img,.frame video,.frame iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.frame .box svg{width:40px;height:40px;display:block;margin:0 auto 6px}
.frame figcaption{font-size:14px;color:var(--soft);margin-top:8px}
.portrait .box{aspect-ratio:1;max-width:320px;border-radius:50%}
.with-photo{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:22px}
.bx{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;position:relative}
.bx .pic{aspect-ratio:4/3;background:#f4f6f9;display:grid;place-items:center;color:var(--faint);font-weight:600;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.bx .pic img{width:100%;height:100%;object-fit:cover;display:block}
.bx .pic svg{width:40px;height:40px;display:block;margin:0 auto 6px}
.bx .bxh{margin:16px 18px 0;font-size:21px}.bx .bxt{margin:12px 14px 0;width:auto}
.bx .txt{padding:10px 18px 18px;min-height:96px;white-space:pre-wrap;overflow-wrap:anywhere}
.bx .txt:empty::before{content:"Text";color:var(--faint)}
.bx textarea{font:inherit;border:0;padding:16px 18px;min-height:120px;resize:vertical;outline-offset:-3px;width:100%;color:var(--ink)}
.bx .x{position:absolute;top:8px;right:8px;z-index:2;min-width:36px;height:36px;border-radius:18px;border:0;background:rgba(255,255,255,.95);box-shadow:var(--sh);font:700 15px var(--sans);cursor:pointer;color:var(--ink);padding:0 10px}
.bx .x:hover{background:#ffe3e0}
.add{border:2px dashed #b9c4d6;border-radius:14px;background:#f8fafd;display:grid;place-items:center;min-height:260px;cursor:pointer;color:var(--blue);font:600 16px var(--sans)}
.add:hover{border-color:var(--blue);background:var(--sky)}
.add span{display:block;font:300 56px/1 var(--sans);text-align:center}







.editlink{background:none;border:0;color:#9fb0cc;font:inherit;font-size:13.5px;text-decoration:underline;cursor:pointer;padding:10px 0;min-height:44px}
.hc{display:flex;flex-direction:column;gap:6px}
.hc h3{margin:0 0 8px}
.hc .bx.flat{box-shadow:none;margin:4px 0 14px}
.hc .more{margin-top:auto;width:max-content}
.hin{font:inherit;border:1px solid #cfd5de;border-radius:8px;padding:8px 10px;width:100%;min-height:42px}
.hin.lab{font:700 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.hin.ttl{font:700 21px var(--serif);color:var(--ink)}
footer i{font-style:italic}
.school{padding:26px 0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px 32px;flex-wrap:wrap}
.facts1{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 28px;color:#c4d3ee;font-size:15px}
.facts1 li{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.facts1 li+li{padding-left:28px;border-left:1px solid rgba(255,255,255,.22)}
.facts1 b{font:700 26px/1 var(--serif);color:#fff}
html.zh .facts1 .tr{display:inline;margin-left:4px}
@media(max-width:600px){.facts1 li+li{padding-left:0;border-left:0}.facts1{gap:8px 20px}}
/* round, personal style */
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:40px 32px;align-items:start}
.rnd{display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:inherit;position:relative;background:none;border:0;box-shadow:none;overflow:visible}
.rnd .pic{width:min(100%,230px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#fffdf8,#f3eee3 70%);box-shadow:0 10px 30px rgba(19,41,75,.12),inset 0 0 0 1px rgba(217,162,27,.18);display:grid;place-items:center;color:var(--faint);font-weight:600;margin-bottom:18px;border:0;position:relative;transition:transform .25s,box-shadow .25s}
.rnd .pic img{width:100%;height:100%;object-fit:cover;display:block}
.rnd .pic.ico svg{width:46%;height:46%}
a.rnd:hover .pic,.rnd:hover .pic{transform:translateY(-3px);box-shadow:0 16px 36px rgba(19,41,75,.18),inset 0 0 0 2px rgba(217,162,27,.45)}
.rnd .lab{font:700 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#b07f0b;margin-bottom:6px}
.rnd h3{margin:0 0 8px;font-size:22px;color:var(--navy)}
.rnd .txt{margin:0 auto 12px;max-width:32ch;color:var(--soft);padding:0;min-height:0;white-space:pre-wrap}
.rnd .txt:empty{display:none}
.rnd .bxh{margin:0 0 6px}
.rnd .more{margin-top:4px}
.rnd textarea,.rnd .hin{width:100%;max-width:320px;margin:4px 0;text-align:center}
.rnd textarea{border:1px solid #cfd5de;border-radius:8px;min-height:96px;padding:10px 12px}
.rnd .x{top:0;right:calc(50% - 125px)}
.rndadd{width:min(100%,230px);aspect-ratio:1;border-radius:50%;min-height:0;justify-self:center}
.nowbar{background:var(--yellowS);border-top:1px solid #f1e2a6;border-bottom:1px solid #f1e2a6}
.nowbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 30px;padding-block:12px;font-size:15px;color:var(--ink)}
.nowbar b{font-variant-numeric:tabular-nums;font-size:17px}
.nb-h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy)}
.ndot{width:9px;height:9px;border-radius:50%;background:#e0453a;box-shadow:0 0 0 3px rgba(224,69,58,.2)}
.nb-l{color:var(--soft);font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.nb-i{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.nowbar a{color:var(--blue)}
html.zh .nowbar .tr{display:inline;margin-left:4px;font-size:.9em}
.ghstatus{margin:0;flex-basis:100%;font-size:13.5px;color:#c4d3ee}
.linkbtn{background:none;border:0;color:var(--yellow);font:inherit;text-decoration:underline;cursor:pointer;padding:6px 2px;min-height:36px}
.ghsetup{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,460px);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:24px;border-top:5px solid var(--yellow)}
.ghsetup[hidden]{display:none}
.ghsetup label{display:block;font-weight:600;font-size:14px;margin:10px 0 0}
.ghsetup input{display:block;width:100%;font:16px var(--sans);border:1px solid #cfd5de;border-radius:8px;padding:10px 12px;margin-top:4px;min-height:44px}
.ghsetup .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ghsetup .linkbtn{color:var(--blue)}
.btn:disabled{opacity:.6;cursor:wait}

.crow input{width:38px;height:30px;border:1px solid #cfd5de;border-radius:8px;padding:2px;background:#fff;cursor:pointer;flex:none}
.seg.wide{width:auto;padding:0 10px;font:600 13px var(--sans)}
body.editing .brand .logo,body.editing .gate .logo{cursor:pointer;outline:1.5px dashed rgba(31,78,156,.45);outline-offset:4px;border-radius:50%}

.tabs a .ce,.sub a .ce{outline-offset:2px}

.ffill i{display:block;width:18px;height:18px;border-radius:5px;border:2px solid #fff}
.ffill[hidden]{display:none!important}
.fmtcolors .ctitle{margin:0 0 8px;font:700 13px var(--sans);color:var(--navy)}
.sendb{justify-self:start}
.tabs a[style*="background"].on,.sub a[style*="background"].on,.pillrow a[style*="background"].on{box-shadow:inset 0 -3px 0 var(--yellow),0 0 0 2px var(--navy)}
.more[style*="background"]{padding:4px 12px;border-radius:999px;border-bottom:0}

.pillw{position:relative;display:inline-flex}
.pillx{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:999px;border:1px solid #d5dbe5;background:#fff;color:#d64545;font:700 13px/1 var(--sans);cursor:pointer;padding:0 5px;box-shadow:0 2px 6px rgba(19,41,75,.15);z-index:2}
.pillx:hover,.pillx.armed{background:#d64545;color:#fff;border-color:#d64545}
.pillhide{width:38px;height:38px;align-self:center}
.pillrow{align-items:center}

.pillt{position:absolute;top:-10px;right:-10px;display:flex;gap:3px;z-index:2}
.pillt .pillx{position:static}
.pillg{width:22px;height:22px;border-radius:50%;border:1px solid #d5dbe5;background:#fff;color:var(--navy);cursor:pointer;padding:0;display:grid;place-items:center;box-shadow:0 2px 6px rgba(19,41,75,.15)}
.pillg svg{width:13px;height:13px}
.pillw{margin-right:14px}
.fwrap{font-size:12.5px!important;white-space:nowrap}
.addtxt{margin-top:14px;border-style:dashed;color:var(--blue)}
.pagehead .tblock{margin-top:14px;max-width:68ch;justify-self:auto}
.pagehead .tblock p{color:var(--soft);font-size:18px}

/* flexible box layout: each box keeps its own size */
.rounds{display:flex!important;flex-wrap:wrap;justify-content:center;gap:44px 32px;align-items:flex-start}
.rounds>.rnd{flex:0 1 280px;max-width:100%}
.rounds>.rnd.sz-s{flex-basis:200px}
.rounds>.rnd.sz-l{flex-basis:360px}
.rounds>.rnd.shp-wide{flex-basis:480px}
.rounds>.rnd.shp-wide.sz-s{flex-basis:340px}
.rounds>.rnd.shp-wide.sz-l{flex-basis:680px}
.rounds>.tblock{flex:1 1 100%}
.rounds>.addwrap{flex:0 0 200px}
.rnd.shp-wide .pic img{object-fit:cover}
.rounds>.addwrap.atstart{flex:1 1 100%;flex-direction:row;min-height:0;gap:12px;padding:10px;border:2px dashed #c9d3e2;border-radius:16px;background:rgba(234,241,251,.5)}
.addwrap.atstart .pcap{font-size:15px;color:var(--blue)}

.eb.drag{cursor:grab;touch-action:none}
.eb.drag:active{cursor:grabbing}
.dghost{position:fixed;z-index:90;pointer-events:none;opacity:.88;transform:scale(.96) rotate(-1deg);box-shadow:0 24px 60px rgba(19,41,75,.3);border-radius:20px;background:rgba(255,255,255,.75)}
.dsrc{opacity:.28;filter:grayscale(.4)}
.dline{position:fixed;z-index:89;width:4px;border-radius:4px;background:var(--blue);box-shadow:0 0 0 4px rgba(31,78,156,.18);pointer-events:none}
.dline::before,.dline::after{content:"";position:absolute;left:-5px;width:14px;height:14px;border-radius:50%;background:var(--blue)}
.dline::before{top:-7px}.dline::after{bottom:-7px}
.dhline,.dvline{position:fixed;z-index:88;pointer-events:none;border:0 dashed rgba(31,78,156,.45)}
.dhline{height:0;border-top-width:1.5px}
.dvline{width:0;border-left-width:1.5px;border-color:rgba(246,185,0,.7)}
[hidden].dline,[hidden].dhline,[hidden].dvline{display:none}
.dcont{outline:2px dashed rgba(31,78,156,.25);outline-offset:14px;border-radius:18px}
body.dragging,body.dragging *{user-select:none;cursor:grabbing!important}
body.dragging .chgo{opacity:0!important}
.rounds.al-left{justify-content:flex-start!important}
.rounds.al-right{justify-content:flex-end!important}

.rounds.gridm>.tblock{width:100%}
.rounds.gridm>.addwrap{align-self:center}
.dgrid{position:fixed;inset:0;z-index:87;pointer-events:none}

async function ghPutFile(path,b64,message){const g=ghGet();if(!g)throw new Error("setup");
 const api=`https://api.github.com/repos/${encodeURIComponent(g.user)}/${encodeURIComponent(g.repo)}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
 const H={"Authorization":"Bearer "+g.token,"X-GitHub-Api-Version":"2022-11-28","Accept":"application/vnd.github+json"};
 const r=await fetch(api,{method:"PUT",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({message,content:b64,branch:g.branch})});
 if(r.status===401||r.status===403)throw new Error("key");if(!r.ok)throw new Error("other")}
const fileB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(f)});

  if(meta.status===401||meta.status===403)throw new Error("key");if(meta.status===404)throw new Error("notfound");if(!meta.ok)throw new Error("other");
  const sha=(await meta.json()).sha;
  const raw=await fetch(api+"?ref="+encodeURIComponent(g.branch),{headers:{...H,"Accept":"application/vnd.github.raw+json"},cache:"no-store"});
  if(!raw.ok)throw new Error("other");const src=withData(await raw.text());if(!src)throw new Error("format");
  const put=await fetch(api,{method:"PUT",headers:{...H,"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({message:"Update website content",content:b64utf8(src),sha,branch:g.branch})});
  if(put.status===401||put.status===403)throw new Error("key");if(put.status===409)throw new Error("conflict");if(!put.ok)throw new Error("other");
  try{localStorage.removeItem("weh-boxes")}catch(e){}
  msg("Published! Your changes will be live for everyone in about a minute.");
 }catch(err){const k=err.message;
  msg(k==="key"?"GitHub didn’t accept the access key. Click “Change” and paste a new key with Contents: Read and write."
   :k==="notfound"?"Couldn’t find that repository or file. Click “Change” and check the username, repository and branch."
   :k==="conflict"?"The website changed at the same time. Please click Publish again."
   :k==="format"?"The file on GitHub isn’t this website’s file. Check the file path under “Change”."
   :"Couldn’t publish right now. Check your internet connection and try again. Your changes are still saved here.");
 }finally{btn.disabled=false}});
$("#dl").addEventListener("click",async()=>{msg("Preparing the file…");
 try{const r=await fetch(location.href.split("#")[0],{cache:"no-store"});if(!r.ok)throw 0;const src=withData(await r.text());if(!src)throw 0;
  const url=URL.createObjectURL(new Blob([src],{type:"text/html"}));const a=document.createElement("a");a.href=url;a.download="index.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  msg("Downloaded index.html. Upload it to your website to replace the old one.")}
 catch(e){msg("Download works once the site is online at its own address (like GitHub Pages). Your changes are still saved in this browser.")}});
ghStatus();

/* ---------- language ---------- */
function setLang(v){document.documentElement.classList.toggle("zh",v==="zh");document.querySelectorAll(".langmenu button").forEach(b=>b.setAttribute("aria-checked",b.dataset.v===(v==="zh"?"zh":"en")))}
const closeMenus=()=>document.querySelectorAll("[data-langbox]").forEach(bx=>{bx.querySelector(".langmenu").hidden=true;bx.querySelector(".langbtn").setAttribute("aria-expanded","false")});
document.querySelectorAll("[data-langbox]").forEach(bx=>{const btn=bx.querySelector(".langbtn"),menu=bx.querySelector(".langmenu");
 btn.addEventListener("click",e=>{e.stopPropagation();const open=menu.hidden;closeMenus();menu.hidden=!open;btn.setAttribute("aria-expanded",String(open))});
 menu.addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(!b)return;setLang(b.dataset.v);closeMenus();btn.focus()})});
document.addEventListener("click",closeMenus);document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenus()});
setLang("en");

applyTheme();applyLook();renderGate();

/* ---------- views (owner) ---------- */
async function showViews(){const v=$("#views");v.hidden=false;
 if(!(GOATCOUNTER&&/^[a-z0-9-]+$/.test(GOATCOUNTER))){v.textContent="Views: set up GoatCounter";return}
 v.textContent="Views: …";
 try{const r=await fetch(`https://${GOATCOUNTER}.goatcounter.com/counter/TOTAL.json`);if(!r.ok)throw 0;const d=await r.json();v.textContent="Website views: "+String(d.count??"—")}
 catch(e){v.textContent="Views: open your GoatCounter dashboard"}}
if(GOATCOUNTER&&/^[a-z0-9-]+$/.test(GOATCOUNTER)){const s=document.createElement("script");s.async=true;s.src="//gc.zgo.at/count.js";s.dataset.goatcounter=`https://${GOATCOUNTER}.goatcounter.com/count`;document.body.appendChild(s)}

window.addEventListener("hashchange",()=>render());
render();

const gate=$("#gate");let seen=false;try{seen=sessionStorage.getItem("ta-welcome")==="1"}catch(e){}
if(!seen){gate.hidden=false;$("#enter").focus()}
$("#enter").addEventListener("click",()=>{gate.hidden=true;try{sessionStorage.setItem("ta-welcome","1")}catch(e){}});
}
</script>
